name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
      

    steps:
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev libhidapi-dev
      
    - uses: actions/checkout@v4
    
    - name: Build
      run: cargo build --release --verbose

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: linuxblaster_control
        path: target/release/linuxblaster_control
