# Hold snd-usb-audio back from the Sound BlasterX G6's first cold-boot
# enumeration. That enumeration reports an illegal UAC clock source and
# produces a card with a broken clock tree. g6-coldboot-prep.sh resets and
# re-enumerates the device, then loads this module explicitly; a blacklist
# only blocks alias-based auto-loading, so the explicit modprobe works.
#
# The blacklist applies to the module, not to one device: while it is
# installed and no G6 has been prepared in this boot, other USB audio
# devices need "sudo modprobe snd-usb-audio" once. See README.md.
blacklist snd-usb-audio
